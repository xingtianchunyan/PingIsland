# 屏之岛 CI
# 依据：《屏之岛_KimiCode环境配置任务书》阶段 4 + 开发执行文档 4.3 节
#
# 当前启用：规则引擎 swift test（平台无关，macOS runner）。
# 未签名 IPA 构建与模拟器测试任务：等待 macOS 环境完成 Phase 0 工程引导后启用
# （当前仓库尚无 Xcode 工程，启用必然失败，违反"直到变绿"要求）。

name: ios

on:
  push:
    branches: [main, "chore/**", "feat/**", "spike/**", "test/**"]
  pull_request:

jobs:
  rules-test:
    name: 规则引擎 swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: 运行 PingIslandKit 单元测试
        working-directory: PingIslandKit
        run: swift test --parallel

