# 屏之岛 CI
# 路线：Windows 写码 + 规则测试 → GitHub Actions 云编译 IPA → Sideloadly 装真机
# 依据：《屏之岛_KimiCode环境配置任务书》阶段 4 + 开发执行文档 4.3 节

name: ios

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**", "spike/**", "test/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rules-test:
    name: 规则引擎 swift test
    # 公开库 macOS 免费不限量；不折腾 Ubuntu setup-swift 版本清单
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: 显示工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: 运行 PingIslandKit 单元测试
        working-directory: PingIslandKit
        run: swift test --parallel

  simulator-test:
    name: 模拟器集成/UI 测试
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 创建并启动模拟器
        run: |
          RUNTIME=$(xcrun simctl list runtimes iOS -j | python3 -c "
          import json,sys
          r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable')]
          print(r[-1]['identifier'])")
          echo "使用运行时: $RUNTIME"
          UDID=$(xcrun simctl create PingIslandCI "iPhone 16" "$RUNTIME")
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: 运行模拟器测试
        run: |
          xcodebuild test -scheme PingIsland -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PingIslandTests \
            -derivedDataPath DerivedData

  ios-build:
    name: 构建未签名 IPA
    runs-on: macos-26
    needs: [rules-test, simulator-test]
    steps:
      - uses: actions/checkout@v5
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 归档（未签名，generic/iOS）
        run: |
          xcodebuild archive -scheme PingIsland -configuration Release \
            -archivePath build/PingIsland.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: 打包 IPA
        run: |
          ls build/PingIsland.xcarchive/Products/Applications/
          mkdir -p build/Payload
          cp -R build/PingIsland.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr PingIsland-unsigned.ipa Payload && ls -lh PingIsland-unsigned.ipa
      - name: 上传 IPA 工件
        uses: actions/upload-artifact@v5
        with:
          name: PingIsland-unsigned-ipa
          path: build/PingIsland-unsigned.ipa
          retention-days: 14
